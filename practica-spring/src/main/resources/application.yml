server:
  port: 8082

app:
  saludo: ${APP_SALUDO:Hola desde Spring Boot}

spring:
  datasource:                         # conexión a PostgreSQL + pgvector
    url: jdbc:postgresql://localhost:5433/chatbot
    username: chatbot
    password: chatbot
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.1:8b
        temperature: 0.2
      embedding:
        model: bge-m3
    vectorstore:
      pgvector:
        initialize-schema: true       # crea la extensión, la tabla vector_store y el índice
        dimensions: 1024              # bge-m3 produce 1024 números
        distance-type: COSINE_DISTANCE
        index-type: HNSW